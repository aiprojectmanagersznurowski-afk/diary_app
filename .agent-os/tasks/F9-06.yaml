context: |
  W OnboardingScreen i groqService.ts model Groq był ustawiony na llama-3.3-70b-versatile,
  który w API Groq zwraca 404 (model_not_found). Zmieniamy go na openai/gpt-oss-120b
  (dostępny, obsługiwany i przetestowany z sukcesem na kluczu Groq).
  Dodatkowo konfigurujemy ascAppId: "6818603714" w eas.json dla profilu produkcyjnego iOS,
  co umożliwia w pełni zautomatyzowany submit na TestFlight.
acceptance:
