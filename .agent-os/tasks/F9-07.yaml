context: |
  1. Ekran Analiz:
     - Usunięcie wykresów: Stres vs Spokój (StressCalmChart), Energia (EnergyBarChart) oraz kafelków średnich (AverageTiles).
     - Usunięcie powiązanych wyliczeń (stress, calm, energy) ze statsUseCase.
     - Nowy układ ekranu:
       a) ZAWSZE na samej górze: Ring zgodności z celami życiowymi (GoalAlignmentRing) z opisem.
       b) Pod spodem: Wykres ostatnich dni z wynikiem zgodności celów (GoalAlignmentHistoryChart) w ujęciu 7d / 30d.
       c) Następnie: Dominujące emocje (DominantEmotionsHistogram) w ujęciu ostatnich 7 dni i 30 dni (rozkład / ranking najczęstszych emocji).
  2. Kategoria "Dylematy":
     - Wyświetlanie etykiety/chipu kategorii (w tym "Dylematy") na karcie notatki i szczegółach notatki (NoteDetail.tsx).
  3. Dokumentacja procesowania notatek w docs/10-procesowanie-notatek-i-prompty.md:
     - Dokładny opis architektury pipeline'u, sekwencja (diagram Mermaid) oraz pełne, dokładne prompty (Word-for-word).
