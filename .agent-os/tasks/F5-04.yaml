context: |
  Wzbogacenie ekranu szczegółów dokumentu (DetailScreen.tsx) o sekcję „Powiązane myśli” (docs/02-architektura.md §4, §5, docs/04-roadmapa.md):
  1. Domena i repozytorium:
     - Model RelatedThought (documentId, title, kind, noteType, day, relationType: 'semantic' | 'day' | 'wikilink' | 'llm' | 'manual', score, reason).
     - Interfejs IRelatedThoughtsRepository oraz implementacja SupabaseRelatedThoughtsRepository łącząca wyniki RPC similar_documents z bezpośrednimi powiązaniami z tabeli links.
     - Rejestracja w composition root (src/composition/diary.ts).
  2. Logika aplikacji:
     - Use case / useRelatedThoughtsStore ładujący powiązane myśli po załadowaniu dokumentu w DetailScreen.
  3. Prezentacja w DetailScreen:
     - Nowa sekcja „Powiązane myśli” (analogicznie do istniejących sekcji w DetailScreen).
     - Karta każdej powiązanej myśli z tytułem, datą, typem relacji i ikoną typu notatki.
     - Kliknięcie w powiązaną myśl przechodzi do szczegółów tej notatki (navigation.push / navigate Detail z nowym entryId).
     - Obsługa stanu pustego (gdy brak powiązań).
acceptance:
