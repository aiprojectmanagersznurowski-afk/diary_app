context: |
  Implementacja interfejsu czatu z pamiętnikiem w aplikacji mobilnej (docs/02-architektura.md §6.4):
  1. Domena i infrastruktura:
     - Modele ChatMessage, ChatThread, Citation w src/domain/models/Chat.ts.
     - IChatRepository i implementacja SupabaseChatRepository z obsługą pobierania historii oraz wysyłki wiadomości ze strumieniowaniem odpowiedzi z Edge Function chat.
  2. Stan (useChatStore):
     - Zarządzanie aktywnym wątkiem, listą wiadomości, stanem strumieniowania (isStreaming, streamingContent), obsługą błędów.
  3. Prezentacja i cytaty:
     - ChatScreen z listą wiadomości, dymkami użytkownika i asystenta, autoscrollem do dołu, polem wpisywania i przyciskami szybkich pytań (np. „Co robiłem wczoraj?”, „Podsumuj mój tydzień”).
     - Komponent wiadomości parsujący cytaty [doc:<id>] i renderujący je jako klikalne odnośniki/pigułki.
     - Kliknięcie w cytat otwiera DetailScreen dla wskazanego dokumentu (lub GraphScreen z zaznaczonym węzłem).
  4. Nawigacja:
     - Rejestracja ChatScreen w RootStackParamList i App.tsx.
     - Dostęp z nagłówka HomeScreen (ikona wiadomości / czatu obok grafu i odznak).
acceptance:
  - "ChatScreen renderuje historię wiadomości i stan strumieniowania odpowiedzi"
  - "cytaty [doc:<id>] są parsowane i renderowane jako klikalne odnośniki prowadzące do DetailScreen"
  - "użytkownik może wysłać wiadomość i otrzymać strumieniowaną odpowiedź z Edge Function"
  - "ekran czatu jest zarejestrowany w nawigacji i dostępny z HomeScreen"
  - "npx tsc --noEmit i ESLint bez błędów"
human_steps:
  - "CP-DEVICE: weryfikacja interfejsu czatu i płynności strumieniowania na urządzeniu mobilnym"
