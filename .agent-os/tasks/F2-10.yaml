context: |
  Zgłoszone z urządzenia 2026-10-05: po nagraniu ekran pokazuje „Data extraction failed: 404 …
  The model llama-3.3-70b-versatile does not exist”. Źródło: RecordAndProcessEntryUseCase po
  zapisaniu nagrania do kolejki dodatkowo transkrybuje je i analizuje LLM w aplikacji
  (GroqAiService, api.groq.com z klienta) i zapisuje wynik do InMemoryDiaryRepository, którego
  od F3-06 nic nie wyświetla. To łamie ADR-003 (AI tylko w supabase/functions) i jest znanym
  błędem z tabeli w roadmapie. Naprawa: stopRecordingAndProcess zapisuje nagranie w kolejce
  (EnqueueRecordingUseCase) i uruchamia wysyłkę (ProcessRecordingQueueUseCase); transkrypcję,
  notatki i wpis dnia robi serwer (process-recording, build-daily). Bez wywołań IAiService i
  bez zapisu do IDiaryRepository w tej ścieżce. Onboarding (cele z GroqAiService) poza zakresem.
acceptance:
  - "stopRecordingAndProcess nie wywołuje IAiService ani IDiaryRepository; zapisuje nagranie w kolejce i uruchamia jej przetwarzanie"
  - "błąd wysyłki kolejki nie gubi nagrania (zostaje w kolejce) i nie jest pokazywany jako błąd AI"
  - "testy jest dla nowej ścieżki nagrania; tsc, lint i jest przechodzą"
fixes_known_bugs:
  - "recordAndProcess.ts: analiza LLM w aplikacji po nagraniu (ADR-003); wynik trafiał do nieużywanego magazynu w pamięci"
human_steps:
  - "CP-DEVICE: nagranie na iPhonie nie pokazuje błędu 404, trafia na listę „Status nagrań” i (po wdrożeniu serwera) do notatek"
