context: |
  Pierwsza część interfejsu grafu wiedzy (docs/02-architektura.md §6.5, docs/03-stos-technologiczny.md):
  1. Zależności:
     - Dodanie react-force-graph-2d do package.json (oraz ewentualnych typów). Wymaga zgłoszenia CP-DEP.
  2. Domena i infrastruktura:
     - Modele w src/domain/models/Graph.ts: GraphNode (id, title, kind, noteType, day, categoryId, tags), GraphEdge (source, target, kind, score), GraphData.
     - Interfejs IGraphRepository w domain oraz implementacja SupabaseGraphRepository w infrastructure wołająca supabase.rpc('get_graph', ...).
     - Instancje tworzone w composition root (src/composition/diary.ts).
  3. Stan i use cases:
     - useGraphStore (zustand) do pobierania danych grafu, obsługi stanu ładowania/błędu oraz zaznaczonego węzła.
  4. Komponent grafu:
     - Na webie bezpośrednie renderowanie react-force-graph-2d.
     - Na platformach natywnych (iOS, Android) komponent z dyrektywą 'use dom' (Expo DOM Component, SDK 54).
     - Kliknięcie węzła emituje zdarzenie / otwiera DetailScreen dla danego dokumentu.
  5. Nawigacja:
     - Dodanie GraphScreen do RootStackParamList w src/navigation/types.ts i rejestracja w App.tsx.
     - Przycisk przejścia do ekranu grafu w HomeScreen.
acceptance:
