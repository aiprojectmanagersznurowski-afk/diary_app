    - src/infrastructure/config/**
    - src/infrastructure/supabase/supabaseClient.ts
    - src/infrastructure/supabase/supabaseChatRepository.ts
    - src/composition/**
    - src/presentation/screens/LoginScreen.tsx
    - src/presentation/screens/ConfigErrorScreen.tsx
    - src/presentation/components/ErrorBoundary.tsx
