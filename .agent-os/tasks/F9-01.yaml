depends_on: [F8-01]
roadmap: "Walidacja konfiguracji w aplikacji: ekran „Błąd konfiguracji” zamiast cichych wartości zastępczych, `ErrorBoundary` i globalny handler błędów"
read_first:
  - docs/09-audyt-gotowosci.md
  - .agent-os/roles/mobile.md
scope:
