context: |
  docs/08-design-ui.md §2.8–§2.10. Analizy: przełącznik 7/30 dni, wykres liniowy „Stres vs. Spokój”
  (wygładzone krzywe, wypełnienie pod Spokojem, kropki na ostatnim punkcie), kafelki średnich, wykres słupkowy
  energii, pierścień zgodności z celami z komunikatem, wszystko z getDailyAnalyticsData (react-native-svg).
  Paski per cel poza zakresem (decyzja w docs/08). Osiągnięcia: duża liczba serii z płomieniem, 7 kropek
  tygodnia, tekst „Do odznaki … brakuje N dni serii.”, gablota odznak z zablokowanymi (opacity ~.45, kłódka,
  wymaganie); progi odznak zostają obecne (docs/08, otwarte pytania). Ustawienia: cele (chipy), osobowość AI
  (radio, 4 opcje), wybór motywu (Dark / Light / Sepia, natychmiast), „Zresetuj Cele Życiowe” i „Wyloguj się” z
  alertami potwierdzenia w stylu iOS (Anuluj + czerwona akcja). Reset celów wraca do Onboardingu.
