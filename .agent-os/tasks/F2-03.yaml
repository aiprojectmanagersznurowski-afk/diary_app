context: |
  Interfejsy SttProvider, LlmProvider (w tym odpowiedź JSON i strumieniowanie), EmbeddingProvider.
  Adaptery groq (STT whisper, LLM) i gemini (LLM, embeddingi z output_dimensionality = EMBED_DIM).
  Fabryka wybiera dostawcę i model per zadanie z env (STT_*, LLM_STRUCTURE_*, LLM_DIGEST_*,
  LLM_LINK_*, LLM_CHAT_*, EMBED_*). Nazwy modeli zweryfikuj w dokumentacji dostawców.
  Wywołania przez fetch (bez SDK) albo SDK zgłoszone jako CP-DEP. Ponawianie przy 429/5xx.
acceptance:
  - "zmiana dostawcy/modelu zadania wymaga tylko zmiany zmiennej środowiskowej"
  - "embeddingi mają długość EMBED_DIM (1536); inna długość = błąd"
  - "deno test: każdy adapter z atrapą fetch (sukces, 429 z ponowieniem, błąd), bez prawdziwych kluczy"
  - "żaden plik poza _shared/ai nie woła dostawców (bramka ai-boundary)"
human_steps:
  - "CP-SECRETS: sekrety i zmienne modeli w Supabase"
