phase: 2
role: edge
branch: feat/F2-03-shared-ai
depends_on: [F1-01, F1-07]
roadmap: "`_shared/ai`: interfejsy i adaptery Groq i Gemini, konfiguracja przez zmienne środowiskowe"
read_first:
  - docs/02-architektura.md#7-warstwa-ai
  - docs/03-stos-technologiczny.md#modele-ai
  - docs/05-decyzje.md  # ADR-003, ADR-006
scope:
